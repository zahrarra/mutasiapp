name: mutasiku
description: "Aplikasi pengelolaan dan pelacakan mutasi aset internal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State management — Riverpod
  flutter_riverpod: ^2.6.1

  # Routing — go_router
  go_router: ^14.6.2

  # Secure storage for auth tokens/credentials
  flutter_secure_storage: ^9.2.2

  # Light local storage for preferences
  shared_preferences: ^2.3.3

  # Connectivity status
  connectivity_plus: ^6.1.1

  # HTTP client abstraction
  http: ^1.2.2

  # Font: Inter (DESIGN.md §6)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Mocking for unit tests
  mockito: ^5.4.5

  # Code generation (required by mockito @GenerateMocks)
  build_runner: ^2.4.13

flutter:
  uses-material-design: true


  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
